name: Update portfolio

on:
  schedule:
    - cron: '17 13 * * 1'   # every Monday at 13:17 UTC
  workflow_dispatch: {}      # lets you trigger a refresh by hand

permissions:
  contents: write            # only enough to commit the regenerated README

concurrency:
  group: update-portfolio
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Regenerate README
        env:
          PORTFOLIO_CONFIG: ${{ secrets.PORTFOLIO_CONFIG }}   # curated content + repo mapping (secret)
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}         # read-only PAT, personal repos only
        run: node scripts/generate-portfolio.mjs --out README.md

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name "portfolio-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: weekly portfolio refresh"
            git push
          else
            echo "No changes to commit."
          fi
